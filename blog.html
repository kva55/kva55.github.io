<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Elysee Franchuk (kva55)</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #333;
            color: #fff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #222;
            padding: 1em 0;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 2em;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #444;
            padding: 0.5em 0;
        }
        nav a {
            color: #ddd;
            text-decoration: none;
            padding: 0.5em 1em;
            margin: 0 0.5em;
            background-color: #555;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        nav a:hover {
            background-color: #666;
        }
        main {
            margin: 2em auto;
            max-width: 900px;
            padding: 2em;
            background: #444;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .blog-posts {
            display: flex;
            flex-direction: column;
            gap: 1.5em;
        }
        .blog-post {
            display: flex;
            align-items: center;
            background-color: #555;
            padding: 1em;
            border-radius: 8px;
        }
        .blog-post img {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            margin-right: 1em;
        }
        .blog-post-content h3 {
            margin: 0 0 0.5em 0;
            color: #ffcc00;
        }
        .blog-post-content p {
            margin: 0;
            color: #ddd;
        }
        footer {
            background-color: #222;
            text-align: center;
            padding: 1.5em 0;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <h1>Blog - Elysee Franchuk <span style="font-size: 0.8em;">(kva55)</span></h1>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="index.html">About</a>
        <a href="blog.html">Blogs</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- Main Content -->
    <main>
        <h2>Blog Posts</h2>
        <div class="blog-posts" id="blog-posts"></div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 <strong>Elysee Franchuk</strong> (kva55). All rights reserved.</p>
    </footer>

    <script>
        fetch('posts.json')
            .then(response => response.json())
            .then(posts => {
                const blogContainer = document.getElementById('blog-posts');
                posts.forEach(post => {
                    const postElement = document.createElement('div');
                    postElement.classList.add('blog-post');
                    postElement.innerHTML = `
                        <img src="${post.image}" alt="${post.title} thumbnail">
                        <div class="blog-post-content">
                            <h3><a href="${post.link}" style="text-decoration: none; color: #ffcc00;">${post.title}</a></h3>
                            <p>${post.summary}</p>
                            <small>${post.date}</small>
                        </div>
                    `;
                    blogContainer.appendChild(postElement);
                });
            })
            .catch(error => console.error('Error loading posts:', error));
    </script>
</body>
</html>
